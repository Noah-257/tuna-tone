<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Guitar Tuna</title>
</head>
<body>
    <main class="tuner">
        <h1>Welcome to Tuna Tone</h1>

        <label for="frequencyInput">Frequency (Hz)</label>

        <input
            type="number" 
            id="frequencyInput" 
            placeholder="Enter frequency in Hz (Example: 110)"
            step="0.01"
        >

        <button id="detectButton">Detect Note</button>

        <button id="startMicrophoneButton">Start Microphone</button>

        <h2 id="noteDisplay">--</h2>

        <p id="frequencyDisplay">Enter a frequency</p>

        <p id="centsDisplay"></p>

        <p id="statusDisplay"></p>

    </main>
    
    <script src="app.js"></script>

</body>
</html>
